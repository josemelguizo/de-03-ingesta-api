[project]
name = "ingesta-trm"
version = "0.1.0"
description = "Ingesta incremental de la TRM desde la API de datos.gov.co"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "duckdb>=1.1", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
